<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animated GIF on Canvas with gifuct-js</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    canvas { border: 1px solid #ccc; }
  </style>
</head>
<body>
  <canvas id="gifCanvas" width="400" height="300"></canvas>

  <!-- load gifuct-js -->
  <script src="https://unpkg.com/gifuct-js/dist/gifuct.min.js"></script>
  <script>
    const { parseGIF, decompressFrames } = window.gifuct;
    const canvas  = document.getElementById('gifCanvas');
    const ctx     = canvas.getContext('2d');
    const url     = 'https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif';

    fetch(url)
      .then(res => res.arrayBuffer())
      .then(buffer => {
        const gif    = parseGIF(buffer);
        const frames = decompressFrames(gif, true);
        let idx      = 0;

        function draw() {
          const frame = frames[idx];
          const imgData = ctx.createImageData(frame.dims.width, frame.dims.height);
          imgData.data.set(frame.patch);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.putImageData(imgData, frame.dims.left, frame.dims.top);

          // schedule next frame
          const delay = (frame.delay || 10) * 10; 
          idx = (idx + 1) % frames.length;
          setTimeout(draw, delay);
        }

        draw();
      })
      .catch(console.error);
  </script>
</body>
</html>
