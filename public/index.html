<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Playfield — AI Orchestration</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; display: flex; gap: 8px; align-items: center; z-index: 10;">
    <input type="text" id="promptInput" placeholder="Enter your scene prompt..." style="width: 300px; padding: 5px;" />
    <button onclick="sendPrompt()" style="padding: 5px 10px; cursor: pointer;">Run</button>
  </div>
  
  
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas')
    const ctx = canvas.getContext('2d')

    let elements = {} // Store elements by ID
    let backgroundColor = '#000000'

    function resizeCanvas() {
      canvas.width = window.innerWidth
      canvas.height = window.innerHeight
    }

    window.addEventListener('resize', resizeCanvas)
    resizeCanvas()

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height)

      ctx.fillStyle = backgroundColor
      ctx.fillRect(0, 0, canvas.width, canvas.height)

      Object.values(elements).forEach(el => {
        ctx.save()
        ctx.globalAlpha = el.opacity ?? 1
        ctx.translate(el.x, el.y)
        ctx.rotate((el.rotation ?? 0) * Math.PI / 180)
        ctx.scale(el.scale ?? 1, el.scale ?? 1)

        if (el.type === 'circle') {
          ctx.beginPath()
          ctx.arc(0, 0, el.radius, 0, Math.PI * 2)
          ctx.fillStyle = el.color
          ctx.fill()
        } else if (el.type === 'text') {
          ctx.fillStyle = el.color
          ctx.font = `${el.size}px sans-serif`
          ctx.textAlign = 'center'
          ctx.textBaseline = 'middle'

          const textWidth = ctx.measureText(el.text).width
          const margin = 10

          let adjustedX = 0

          if (el.x - textWidth / 2 < margin) {
            adjustedX = margin - (el.x - textWidth / 2)
          } else if (el.x + textWidth / 2 > canvas.width - margin) {
            adjustedX = (canvas.width - margin) - (el.x + textWidth / 2)
          }

          ctx.fillText(el.text, adjustedX, 0)
        } else if (el.type === 'rect') {
          ctx.fillStyle = el.color
          ctx.fillRect(0, 0, el.width, el.height)
        } else if (el.type === 'line') {
          ctx.beginPath()
          ctx.moveTo(el.x1 - (el.x ?? 0), el.y1 - (el.y ?? 0))
          ctx.lineTo(el.x2 - (el.x ?? 0), el.y2 - (el.y ?? 0))
          ctx.strokeStyle = el.color
          ctx.lineWidth = el.thickness
          ctx.stroke()
        } else if (el.type === 'point') {
          ctx.beginPath()
          ctx.arc(0, 0, el.size, 0, Math.PI * 2)
          ctx.fillStyle = el.color
          ctx.fill()
        } else if (el.type === 'polygon') {
          const points = el.points
          const offsetX = el.x ?? 0
          const offsetY = el.y ?? 0

          if (points.length > 1) {
            ctx.beginPath()
            ctx.moveTo(points[0][0] + offsetX, points[0][1] + offsetY)
            points.slice(1).forEach(([x, y]) => {
              ctx.lineTo(x + offsetX, y + offsetY)
            })
            ctx.closePath()
            ctx.fillStyle = el.color
            ctx.fill()
          }
        }
        ctx.restore()
      })
    }


    function animateMove(el, targetX, targetY, duration) {
      const startTime = performance.now()
      const startX = el.x
      const startY = el.y

      function animate(time) {
        const elapsed = time - startTime
        const t = Math.min(elapsed / duration, 1)

        el.x = startX + (targetX - startX) * t
        el.y = startY + (targetY - startY) * t

        drawScene()

        if (t < 1) {
          requestAnimationFrame(animate)
        }
      }

      requestAnimationFrame(animate)
    }

    function handleCommand(command) {
      const parts = command.split(':')
      const cmd = parts[0]

      switch (cmd) {
        case 'B': { // Background
          backgroundColor = parts[1]
          drawScene()
          break
        }

        case 'C': { // Circle
          const [id, position, radius, color] = parts.slice(1)
          const [x, y] = position.replace(/[()]/g, '').split(',').map(Number)

          elements[id] = {
            type: 'circle',
            x,
            y,
            radius: Number(radius),
            color,
            rotation: 0,
            scale: 1,
            opacity: 1
          }

          drawScene()
          break
        }

        case 'T': { // Text
          const [text, position, size, color] = parts.slice(1)
          const cleanText = text.replace(/["]/g, '')
          const [x, y] = position.replace(/[()]/g, '').split(',').map(Number)

          const id = `text${Object.keys(elements).length}`

          elements[id] = {
            type: 'text',
            text: cleanText,
            x,
            y,
            size: Number(size),
            color,
            rotation: 0,
            scale: 1,
            opacity: 1
          }

          drawScene()
          break
        }

        case 'M': { // Move
          const [id, position, duration] = parts.slice(1)
          const [x, y] = position.replace(/[()]/g, '').split(',').map(Number)

          const el = elements[id]
          if (el) animateMove(el, x, y, Number(duration))
          break
        }

        case 'F': { // Fade out
          const [id, duration] = parts.slice(1)
          const el = elements[id]
          if (el) animateFade(el, 0, Number(duration))
          break
        }

        case 'S': { // Scale
          const [id, scale, duration] = parts.slice(1)
          const el = elements[id]
          if (el) animateScale(el, Number(scale), Number(duration))
          break
        }

        case 'R': { // Rotate
          const [id, degrees, duration] = parts.slice(1)
          const el = elements[id]
          if (el) animateRotate(el, Number(degrees), Number(duration))
          break
        }

        case 'W': { // Wait / delay
          const [duration] = parts.slice(1)
          setTimeout(drawScene, Number(duration))
          break
        }

        case 'X': { // Remove
          const [id] = parts.slice(1)
          delete elements[id]
          drawScene()
          break
        }

        case 'N': { // Duplicate
          const [sourceId, newId] = parts.slice(1)
          const source = elements[sourceId]
          if (source) {
            elements[newId] = { ...source }
            drawScene()
          }
          break
        }

        case 'L': { // Line
          const [id, start, end, thickness, color] = parts.slice(1)
          const [x1, y1] = start.replace(/[()]/g, '').split(',').map(Number)
          const [x2, y2] = end.replace(/[()]/g, '').split(',').map(Number)

          elements[id] = {
            type: 'line',
            x1, y1, x2, y2,
            thickness: Number(thickness),
            color,
            opacity: 1
          }

          drawScene()
          break
        }

        case 'R': { // Rectangle
          const [id, position, width, height, color] = parts.slice(1)
          const [x, y] = position.replace(/[()]/g, '').split(',').map(Number)

          elements[id] = {
            type: 'rect',
            x,
            y,
            width: Number(width),
            height: Number(height),
            color,
            rotation: 0,
            scale: 1,
            opacity: 1
          }

          drawScene()
          break
        }

        case 'PT': { // Point
          const [id, position, size, color] = parts.slice(1)
          const [x, y] = position.replace(/[()]/g, '').split(',').map(Number)

          elements[id] = {
            type: 'point',
            x,
            y,
            size: Number(size),
            color,
            opacity: 1
          }

          drawScene()
          break
        }

        case 'P': { // Polygon
          const [id, ...rest] = parts.slice(1)
          const color = rest.pop()
          const points = rest.map(pt => pt.replace(/[()]/g, '').split(',').map(Number))

          elements[id] = {
            type: 'polygon',
            points,
            color,
            rotation: 0,
            scale: 1,
            opacity: 1
          }

          drawScene()
          break
        }

        default:
          console.warn('Unknown command:', command)
      }
    }

    function animateFade(el, targetOpacity, duration) {
      const startTime = performance.now()
      const startOpacity = el.opacity

      function animate(time) {
        const elapsed = time - startTime
        const t = Math.min(elapsed / duration, 1)

        el.opacity = startOpacity + (targetOpacity - startOpacity) * t
        drawScene()

        if (t < 1) requestAnimationFrame(animate)
      }

      requestAnimationFrame(animate)
    }

    function animateScale(el, targetScale, duration) {
      const startTime = performance.now()
      const startScale = el.scale

      function animate(time) {
        const elapsed = time - startTime
        const t = Math.min(elapsed / duration, 1)

        el.scale = startScale + (targetScale - startScale) * t
        drawScene()

        if (t < 1) requestAnimationFrame(animate)
      }

      requestAnimationFrame(animate)
    }

    function animateRotate(el, targetDegrees, duration) {
      const startTime = performance.now()
      const startRotation = el.rotation
      const targetRotation = (startRotation + targetDegrees) % 360

      function animate(time) {
        const elapsed = time - startTime
        const t = Math.min(elapsed / duration, 1)

        el.rotation = startRotation + (targetRotation - startRotation) * t
        drawScene()

        if (t < 1) requestAnimationFrame(animate)
      }

      requestAnimationFrame(animate)
    }

    window.onload = function () {
      document.getElementById('promptInput').focus()
    }



    document.getElementById('promptInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        sendPrompt()
      }
    })

    function sendPrompt() {
      
      const prompt = document.getElementById('promptInput').value
      if (!prompt) {
        alert('Please enter a prompt.')
        return
      }



      // ✅ Clear canvas state
      elements = {}
      backgroundColor = '#ffffff' // or whatever default background you like
      drawScene()

      fetch('/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      }).then(response => {
        const reader = response.body.getReader()
        const decoder = new TextDecoder()

        function read() {
          reader.read().then(({ done, value }) => {
            if (done) return
            const chunk = decoder.decode(value)
            chunk.trim().split('\n').forEach(line => {
              if (line.startsWith('data: ')) {
                const command = line.replace(/^data: /, '').trim()
                if (command === '[DONE]') {
                  console.log('✅ Stream completed.')
                } else {
                  handleCommand(command)
                }
              }
            })
            read()
          })
        }

        read()
      }).catch(error => {
        console.error('Stream error:', error)
      })

      document.getElementById('promptInput').value = ''
    }




    // Connect stream
    const eventSource = new EventSource('/stream')

    eventSource.onmessage = (event) => {
      const command = event.data.trim()
      console.log('🎨 Command:', command)
      handleCommand(command)
    }

    eventSource.onerror = (err) => {
      console.error('Stream error:', err)
      eventSource.close()
    }

    drawScene()
  </script>
</body>
</html>
