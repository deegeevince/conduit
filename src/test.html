<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Memory Drift</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #000;
      height: 100%;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

let mouse = { x: w/2, y: h/2 };
const fragments = [];

const memoryLines = [
  "Tokyo. Rain. Ramen.",
  "A quiet street corner.",
  "Time slowed down.",
  "I still remember the steam.",
  "Warmth in the cold."
];

// Generate fragments
for (let i = 0; i < memoryLines.length; i++) {
  fragments.push({
    text: memoryLines[i],
    x: Math.random() * w,
    y: Math.random() * h,
    depth: 0.3 + Math.random() * 0.7,
    opacity: 0,
    angle: 0
  });
}

// Track mouse for parallax
document.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

function draw() {
  ctx.clearRect(0, 0, w, h);
  
  // radial light effect
  const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, w * 0.8);
  gradient.addColorStop(0, "rgba(255,255,255,0.05)");
  gradient.addColorStop(1, "rgba(0,0,0,0.9)");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);

  fragments.forEach((f, i) => {
    const dx = (mouse.x - w / 2) * f.depth * 0.05;
    const dy = (mouse.y - h / 2) * f.depth * 0.05;

    f.x += Math.sin(Date.now() * 0.001 + i) * 0.1;
    f.y += Math.cos(Date.now() * 0.001 + i) * 0.1;
    f.angle += 0.001;
    f.opacity = Math.min(f.opacity + 0.005, 1);

    ctx.save();
    ctx.translate(f.x + dx, f.y + dy);
    ctx.rotate(f.angle);
    ctx.globalAlpha = f.opacity;
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = `${28 + f.depth * 12}px serif`;
    ctx.fillText(f.text, -ctx.measureText(f.text).width / 2, 0);
    ctx.restore();
  });

  requestAnimationFrame(draw);
}

draw();

window.addEventListener("resize", () => {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
});
</script>
</body>
</html>
